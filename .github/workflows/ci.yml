name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -c constraints/ci-python311.txt -e ".[dev]"

      - name: Run tests
        run: pytest -q

  distribution:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel from sdist with verified build dependencies
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci-python311.txt
        run: |
          pip install -c constraints/ci-python311.txt build
          python -m build
      - name: Install a non-editable distribution
        env:
          ARTIFACT: ${{ matrix.artifact }}
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci-python311.txt
        run: |
          if [ "$ARTIFACT" = wheel ]; then pip install dist/*.whl; else pip install dist/*.tar.gz; fi
      - name: Exercise installed import, resources, CLI and synthetic Quickstart
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/scripts/package_smoke.py" "$GITHUB_WORKSPACE"/dist/*

  pi-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/pi-orchestrator/package-lock.json
      - name: Install Pi dependencies
        run: npm --prefix services/pi-orchestrator ci
      - name: Check Pi contracts
        run: npm --prefix services/pi-orchestrator run typecheck
      - name: Run Pi behavioral tests without model credentials
        run: npm --prefix services/pi-orchestrator test

  compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: forge
          MYSQL_USER: forge
          MYSQL_PASSWORD: forge
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uforge -pforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -c constraints/ci-python311.txt -e ".[dev]"

      - name: SQLite compatibility smoke
        run: pytest tests/test_database_compatibility.py -v --tb=short

      - name: PostgreSQL compatibility smoke
        env:
          FORGE_SMOKE_DATABASE_URL: postgresql+psycopg2://forge:forge@127.0.0.1:5432/forge
        run: pytest tests/test_database_compatibility.py -v --tb=short

      - name: MySQL compatibility smoke
        env:
          FORGE_SMOKE_DATABASE_URL: mysql+pymysql://forge:forge@127.0.0.1:3306/forge
        run: pytest tests/test_database_compatibility.py -v --tb=short
