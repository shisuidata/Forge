services:
  forge:
    build: .
    image: forge-agent:prod
    env_file:
      - .env.production
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - forge-data:/app/.forge
      - ./registry/data:/app/registry/data:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/readiness', timeout=5)); sys.exit(0 if data.get('status') != 'fail' else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  forge-data:
